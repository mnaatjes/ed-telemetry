name: CI Pipeline

on:
  push:
    branches: [main, develop, feat/*, fix/*, docs/*]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    name: Lint, Type Check, Invariants, and Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint and Formatting Check
        run: |
          ruff check packages tests
          ruff format --check packages tests

      - name: Run Mypy Static Type Analysis
        run: |
          mypy

      - name: Enforce Architecture Invariants (Import Linter)
        run: |
          lint-imports

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Smoke Test CLI Executable
        run: |
          python -m ed_app
