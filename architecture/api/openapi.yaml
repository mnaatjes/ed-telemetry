openapi: 3.1.0
info:
  title: Elite Dangerous Telemetry HTTP & Streaming API
  version: 1.0.0
  description: >-
    Zero-dependency driving API exposing Elite Dangerous journal ingestion,
    operational status, historical SQLite queries, auxiliary snapshots, and
    real-time Server-Sent Events (SSE).
servers:
  - url: http://127.0.0.1:8080
    description: Local daemon server

paths:
  /api/v1/state:
    get:
      summary: Consolidated state hydration snapshot
      description: Returns the latest live player status, active journal state, most recent journal event, and all auxiliary snapshots.
      responses:
        '200':
          description: Consolidated head telemetry state snapshot.
          headers:
            X-Telemetry-Source:
              schema:
                type: string
                example: "memory-buffer"
            X-Telemetry-Plane:
              schema:
                type: string
                example: "state"
            ETag:
              schema:
                type: string
                example: 'W/"42"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHead'
        '304':
          description: State has not changed since provided ETag.
        '503':
          $ref: '#/components/responses/ProblemDetailsResponse'

  /api/v1/state/heartbeat:
    get:
      summary: Ultra-lightweight state delta heartbeat
      description: Returns monotonic sequence ID, event ID, status hash, and snapshot hashes for sub-millisecond polling.
      responses:
        '200':
          description: State heartbeat payload.
          headers:
            X-Telemetry-Source:
              schema:
                type: string
                example: "memory-buffer"
            X-Telemetry-Plane:
              schema:
                type: string
                example: "state"
            ETag:
              schema:
                type: string
                example: 'W/"42"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHeartbeat'
        '304':
          description: Heartbeat has not changed since provided ETag.
        '503':
          $ref: '#/components/responses/ProblemDetailsResponse'

  /api/v1/status:
    get:
      summary: Watcher operational status or cockpit state
      description: Returns ingestion watcher metrics or cockpit status flags.
      responses:
        '200':
          description: Status response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WatcherStatus'
                  - $ref: '#/components/schemas/GameStatusSnapshot'

  /api/v1/status/game:
    get:
      summary: Active game status snapshot
      description: Returns the latest live player status (from Status.json).
      responses:
        '200':
          description: Live player and cockpit flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatusSnapshot'

  /api/v1/snapshots:
    get:
      summary: All registered auxiliary snapshots
      description: Returns map of all recognized auxiliary snapshots that currently exist on disk.
      responses:
        '200':
          description: Map of active auxiliary snapshots.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/AuxiliarySnapshot'

  /api/v1/snapshots/{name}:
    get:
      summary: Auxiliary game snapshot by name
      description: Returns auxiliary JSON state file (e.g. Market, Cargo, NavRoute).
      parameters:
        - name: name
          in: path
          required: true
          description: Snapshot name (e.g. Market, Cargo, NavRoute)
          schema:
            type: string
      responses:
        '200':
          description: Snapshot payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuxiliarySnapshot'
        '404':
          $ref: '#/components/responses/ProblemDetailsResponse'

  /api/v1/journal/latest:
    get:
      summary: Latest active journal event
      description: Returns the single most recent journal event read directly from the active file tail.
      responses:
        '200':
          description: Latest journal record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryRecord'
                nullable: true

  /api/v1/journal/query:
    get:
      summary: Query historical journal events
      description: Queries the persistent SQLite database in WAL mode with indexing.
      parameters:
        - name: topic
          in: query
          required: false
          schema:
            type: string
          description: Filter by event topic.
        - name: since_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter records with ID greater than this value.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
          description: Maximum number of records to return.
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sort ordering by record ID.
      responses:
        '200':
          description: Array of telemetry records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryRecord'

  /api/v1/journal/queue:
    get:
      summary: Read and drain buffered queue
      description: Retrieves and drains events currently held in the in-memory ring buffer.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Batch of buffered events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryBatch'

  /api/v1/journal/stream:
    get:
      summary: Real-time Server-Sent Events (SSE) feed
      description: |
        Yields real-time events as they are emitted by the ingestion pipeline.
        Transmits initial handshake (`connected`), live journal entries (`telemetry.journal`),
        and file delta notifications (`telemetry.file_delta`).
      responses:
        '200':
          description: Live SSE event stream.
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/system/health:
    get:
      summary: Health check probe
      description: Returns liveness status and service metadata.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    type: string
                    example: "ok"
                  service:
                    type: string
                    example: "ed-telemetry"

  /api/v1/system/watcher:
    get:
      summary: Ingestion watcher operational status
      description: Returns filesystem ingestion watcher status and metrics.
      responses:
        '200':
          description: Ingestion thread metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatcherStatus'

  /api/v1/system/logs:
    get:
      summary: Diagnostic logs snapshot
      description: Returns recent diagnostic log records from the in-memory ring buffer.
      parameters:
        - name: min_level
          in: query
          required: false
          schema:
            type: string
            enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Diagnostic logs snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticLogSnapshot'

  /api/v1/system/control:
    post:
      summary: Watcher lifecycle control
      description: Start or stop the journal watcher thread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [start, stop]
      responses:
        '200':
          description: Control command executed successfully.
        '400':
          $ref: '#/components/responses/ProblemDetailsResponse'

  # Legacy Aliases
  /api/v1/health:
    get:
      summary: Health check probe (legacy alias)
      deprecated: true
      responses:
        '200':
          description: Service is healthy.

  /api/v1/telemetry/head:
    get:
      summary: Consolidated head state snapshot (legacy alias)
      deprecated: true
      responses:
        '200':
          description: Consolidated head telemetry state snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHead'

  /api/v1/diagnostics/logs:
    get:
      summary: Diagnostic logs snapshot (legacy alias)
      deprecated: true
      responses:
        '200':
          description: Diagnostic logs snapshot.

  /api/v1/control/watch:
    post:
      summary: Watcher lifecycle control (legacy alias)
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [start, stop]
      responses:
        '200':
          description: Control command executed successfully.

  /api/v1/events:
    get:
      summary: Query historical telemetry events (legacy alias)
      deprecated: true
      responses:
        '200':
          description: Array of telemetry records.

  /api/v1/events/buffer:
    get:
      summary: Read and drain buffered queue (legacy alias)
      deprecated: true
      responses:
        '200':
          description: Batch of buffered events.

  /api/v1/stream:
    get:
      summary: Real-time Server-Sent Events (SSE) feed (legacy alias)
      deprecated: true
      responses:
        '200':
          description: Live SSE event stream.

components:
  responses:
    ProblemDetailsResponse:
      description: Standard RFC 7807 problem details response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          default: "about:blank"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    WatcherStatus:
      type: object
      required:
        - is_active
        - current_journal
        - events_processed
        - poll_interval
        - buffer_capacity
        - buffer_size
      properties:
        is_active:
          type: boolean
        current_journal:
          type: string
          nullable: true
        events_processed:
          type: integer
        poll_interval:
          type: number
        buffer_capacity:
          type: integer
        buffer_size:
          type: integer

    GameStatusSnapshot:
      type: object
      required:
        - exists
        - raw_payload
      properties:
        exists:
          type: boolean
        is_live_session:
          type: boolean
        target_path:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        raw_payload:
          type: string
        raw_hash:
          type: string
          nullable: true

    AuxiliarySnapshot:
      type: object
      required:
        - target_name
        - exists
        - raw_payload
      properties:
        target_name:
          type: string
        exists:
          type: boolean
        is_live_session:
          type: boolean
        target_path:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        raw_payload:
          type: string
        raw_hash:
          type: string
          nullable: true

    TelemetryRecord:
      type: object
      required:
        - id
        - event_id
        - topic
        - timestamp
        - payload_json
        - created_at
      properties:
        id:
          type: integer
          nullable: true
        event_id:
          type: string
        topic:
          type: string
        timestamp:
          type: string
          format: date-time
        raw_hash:
          type: string
          nullable: true
        payload_json:
          type: string
        created_at:
          type: string
          format: date-time

    TelemetryBatch:
      type: object
      required:
        - events
        - remaining_count
        - dropped_count
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryPayload'
        remaining_count:
          type: integer
        dropped_count:
          type: integer

    TelemetryPayload:
      type: object
      required:
        - topic
        - timestamp
        - payload_bytes
      properties:
        topic:
          type: string
        timestamp:
          type: string
          format: date-time
        payload_bytes:
          type: string
        metadata:
          type: array
          items:
            type: array
            items:
              type: string

    TelemetryHead:
      type: object
      required:
        - timestamp
        - active_journal
        - latest_journal_event
        - game_status
        - snapshots
        - state_sequence
      properties:
        state_sequence:
          type: integer
        timestamp:
          type: string
          format: date-time
        active_journal:
          type: string
          nullable: true
        latest_journal_event:
          $ref: '#/components/schemas/TelemetryRecord'
          nullable: true
        game_status:
          $ref: '#/components/schemas/GameStatusSnapshot'
          nullable: true
        snapshots:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AuxiliarySnapshot'

    TelemetryHeartbeat:
      type: object
      required:
        - state_sequence
        - timestamp
        - active_journal
        - latest_event_id
        - status_hash
        - snapshot_hashes
      properties:
        state_sequence:
          type: integer
        timestamp:
          type: string
          format: date-time
        active_journal:
          type: string
          nullable: true
        latest_event_id:
          type: string
          nullable: true
        status_hash:
          type: string
          nullable: true
        snapshot_hashes:
          type: object
          additionalProperties:
            type: string

    DiagnosticLogRecord:
      type: object
      required:
        - timestamp
        - level
        - logger_name
        - message
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
        logger_name:
          type: string
        message:
          type: string

    DiagnosticLogSnapshot:
      type: object
      required:
        - records
        - total_retained
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticLogRecord'
        total_retained:
          type: integer
